[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "care-hero-local"
version = "0.1.0"
description = "Local video to MediaPipe Pose and FaceMesh landmark pipeline"
requires-python = ">=3.11,<3.13"
dependencies = [
  "mediapipe==0.10.21",
  "jax==0.4.38",
  "jaxlib==0.4.38",
  "numpy>=1.26,<2.0",
  "opencv-contrib-python==4.11.0.86",
  "openai>=2.0,<3",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
stt = ["faster-whisper>=1.1,<2"]
realtime = ["sounddevice>=0.5,<0.6", "faster-whisper>=1.1,<2"]
figures = ["matplotlib>=3.8,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
